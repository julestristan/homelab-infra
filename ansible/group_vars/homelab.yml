---
# Valeurs communes à tous les nœuds du groupe homelab.
# Elles priment sur les valeurs par défaut des rôles (roles/*/defaults/main.yml).

ansible_user: julestristan
homelab_ssh_port: 22

# ssh_hardening : reproduit la configuration relevée avec `sshd -T`.
ssh_hardening_port: "{{ homelab_ssh_port }}"
ssh_hardening_permit_root_login: prohibit-password
ssh_hardening_x11_forwarding: "yes"
ssh_hardening_max_auth_tries: 6

# firewall : le port SSH est géré à part et ne peut pas être retiré par erreur.
firewall_ssh_port: "{{ homelab_ssh_port }}"
firewall_allowed_tcp_ports:
  - 80
  - 443

# fail2ban
fail2ban_ssh_port: "{{ homelab_ssh_port }}"
fail2ban_maxretry: 3
fail2ban_bantime: 1d
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
