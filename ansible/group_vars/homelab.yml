---

ansible_user: julestristan
homelab_ssh_port: 22

# ssh_hardening : PermitRootLogin and X11Forwarding --> "no"
# defined in roles/ssh_hardening/defaults/main.yml.
ssh_hardening_port: "{{ homelab_ssh_port }}"
ssh_hardening_max_auth_tries: 6

# firewall : SSH port dynamically set to the same as homelab_ssh_port, so that the firewall allows SSH connections.
firewall_ssh_port: "{{ homelab_ssh_port }}"
firewall_allowed_tcp_ports:
  - 80
  - 443

# fail2ban
fail2ban_ssh_port: "{{ homelab_ssh_port }}"
fail2ban_maxretry: 3
fail2ban_bantime: 1d
fail2ban_ignoreip:
  - 127.0.0.1/8
  - ::1
  - 192.168.1.0/24
