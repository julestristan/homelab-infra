---
- name: Créer le dossier des clés APT
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Vérifier si la clé GPG de Docker est présente
  ansible.builtin.stat:
    path: /etc/apt/keyrings/docker.asc
  register: docker_gpg_key

# Download if not found.
# Adding when: not docker_gpg_key.stat.exists to ensure idempotency
- name: Télécharger la clé GPG de Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    group: root
    mode: "0644"
  when: not docker_gpg_key.stat.exists

- name: Déclarer le dépôt officiel de Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/debian
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true

- name: Installer Docker et le plugin Compose
  ansible.builtin.apt:
    name: "{{ docker_packages }}"
    state: present

- name: Vérifier la présence de Docker
  ansible.builtin.stat:
    path: /usr/bin/docker
  register: docker_binary

- name: Finaliser la configuration de Docker
  when: docker_binary.stat.exists
  block:
    - name: Activer et démarrer Docker
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Ajouter l'utilisateur d'administration au groupe docker
      ansible.builtin.user:
        name: "{{ docker_admin_user }}"
        groups: docker
        append: true
